name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
      - run: pnpm test
